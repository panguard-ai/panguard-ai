name: Sync ATR stats from upstream

# Pulls the canonical stats.json from agent-threat-rules and rewrites
# the shared fields in packages/website/src/lib/stats.ts so the website
# never drifts from the standard.
#
# Runs every 6 hours and on every push to main that touches stats.ts
# (catches local edits that would otherwise diverge).

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packages/website/src/lib/stats.ts'
      - '.github/workflows/sync-atr-stats.yml'

permissions:
  contents: write
  # pull-requests permission removed — workflow now commits directly to main
  # instead of opening a PR. See "Commit + push to main" step for rationale.

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # pnpm BEFORE setup-node — setup-node@v5 reads the root package.json
      # `packageManager: pnpm@10.30.2` field and prepares pnpm cache during
      # its own step. Without pnpm already on PATH the step exits with
      # "Unable to locate executable file: pnpm" (observed 2026-05-29).
      # Same fix pattern as tc-pr-back.yml.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Fetch upstream stats.json
        # ATR moved stats.json from repo-root to data/ during the Phase 1
        # measurement-layer rewrite (2026-05-23, ATR commit 008239c6).
        # The new schema uses `rules.total` (no longer `ruleCount.total`)
        # and adds a `benchmarks[]` array per Phase 6.
        run: |
          curl -fsSL \
            https://raw.githubusercontent.com/Agent-Threat-Rule/agent-threat-rules/main/data/stats.json \
            -o /tmp/atr-stats.json
          echo "Upstream version:"; node -e "console.log(require('/tmp/atr-stats.json').version)"
          echo "Upstream rules:";   node -e "console.log(require('/tmp/atr-stats.json').rules.total)"

      - name: Pin to the SHIPPED npm package, not upstream HEAD
        # The website bundles agent-threat-rules from npm (see
        # scripts/compile-atr-rules.mjs), so it must cite the PUBLISHED version
        # and that package's rule count — not upstream data/stats.json, whose
        # `.version` lags releases (was stuck at 3.5.0 while npm shipped 3.5.8)
        # and whose `.rules.total` counts unreleased HEAD rules the site does
        # not actually ship. Override both with the real npm package so the
        # citation page stays auditable. The count is EFFECTIVE rules: draft
        # and deprecated rules ship in the package but the engine does not
        # load them, and ATR's outward rule count excludes them.
        run: |
          VER=$(npm view agent-threat-rules version)
          npm pack "agent-threat-rules@${VER}" --pack-destination /tmp >/dev/null
          tar -xzf "/tmp/agent-threat-rules-${VER}.tgz" -C /tmp
          CNT=$(node -e "const fs=require('fs'),path=require('path');let n=0;(function walk(d){for(const e of fs.readdirSync(d,{withFileTypes:true})){const p=path.join(d,e.name);if(e.isDirectory()){walk(p);continue;}if(!e.name.endsWith('.yaml'))continue;const m=fs.readFileSync(p,'utf8').match(/^status:\s*['\"]?([a-z]+)/m);const s=m?m[1]:'';if(s!=='draft'&&s!=='deprecated')n++;}})('/tmp/package/rules');console.log(n);")
          node -e "const fs=require('fs');const p='/tmp/atr-stats.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.version='${VER}';j.rules=j.rules||{};j.rules.total=${CNT};fs.writeFileSync(p,JSON.stringify(j,null,2));"
          echo "Pinned ATR stats to shipped npm v${VER} (${CNT} effective rules)"
          # Detection conditions across the same effective rules, for STATS.atrPatterns.
          # Best effort: if js-yaml cannot be installed, the field is left as it is.
          npm install --prefix /tmp/yaml-tool --no-save --silent js-yaml@4 >/dev/null 2>&1 || true
          PAT=$(node -e "let y;try{y=require('/tmp/yaml-tool/node_modules/js-yaml');}catch{process.exit(0);}const fs=require('fs'),path=require('path');let n=0;(function walk(d){for(const e of fs.readdirSync(d,{withFileTypes:true})){const p=path.join(d,e.name);if(e.isDirectory()){walk(p);continue;}if(!e.name.endsWith('.yaml'))continue;const doc=y.load(fs.readFileSync(p,'utf8'));if(!doc||doc.status==='draft'||doc.status==='deprecated')continue;const c=doc.detection&&doc.detection.conditions;if(Array.isArray(c))n+=c.length;}})('/tmp/package/rules');console.log(n);" 2>/dev/null || true)
          if [ -n "$PAT" ]; then
            node -e "const fs=require('fs');const p='/tmp/atr-stats.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.rules.patterns=${PAT};fs.writeFileSync(p,JSON.stringify(j,null,2));"
            echo "Detection conditions across effective rules: ${PAT}"
          fi

      - name: Rewrite stats.ts shared fields
        run: |
          node packages/website/scripts/apply-atr-stats.mjs /tmp/atr-stats.json packages/website/src/lib/stats.ts

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet packages/website/src/lib/stats.ts; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit + push to main
        # Direct push to main, no PR. Three reasons:
        #
        # 1. apply-atr-stats.mjs only touches deterministic numeric/version
        #    fields gated by `have` checks (see the script). It cannot
        #    invent arbitrary content; the diff is always small + reviewable
        #    via the regular `git log packages/website/src/lib/stats.ts`.
        # 2. The previous "Open sync PR" path failed every 6h because the
        #    panguard-ai repo Setting "Allow GitHub Actions to create and
        #    approve pull requests" is off. Direct push sidesteps that
        #    GitHub limitation entirely.
        # 3. Same pattern this repo already uses for badge-refresh-style
        #    auto-syncs; review is via post-hoc audit, not pre-merge.
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "ATR Stats Sync Bot"
          git config user.email "release@agentthreatrule.org"
          UPSTREAM_VER=$(node -e "console.log(require('/tmp/atr-stats.json').version)")
          UPSTREAM_RULES=$(node -e "console.log(require('/tmp/atr-stats.json').rules.total)")
          git add packages/website/src/lib/stats.ts
          git commit -m "chore(website): sync ATR stats to v${UPSTREAM_VER} (${UPSTREAM_RULES} rules)"
          # Race-safe push: rebase on top of remote main if any new commits
          # landed during the sync. Retries up to 3 times to absorb a
          # cron-collision window (very rare).
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected (attempt $attempt), rebasing on origin/main and retrying"
            git fetch origin main
            git rebase origin/main
          done
          echo "ERROR: failed to push after 3 attempts"
          exit 1
